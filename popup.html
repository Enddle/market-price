<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Top Header: Symbol (Left), Status Dots (Right), Centered Live Percentage -->
  <div class="header-container">
    <div class="header-top-row">
      <div class="symbol-display" id="symbolDisplay">––</div>
      <div class="status-dots">
        <span class="dot grey" id="marketDot" data-tooltip="Market: Closed"></span>
        <span class="dot grey" id="wsDot" data-tooltip="WebSocket: Not Subscribed"></span>
      </div>
    </div>
    <div class="percentage-display neutral" id="percentageDisplay">0.000%</div>
  </div>

  <!-- Settings Foldable Section -->
  <details id="settingsSection" class="foldable-section">
    <summary class="section-title">Settings</summary>
    <div class="section-content">
      <div class="input-group">
        <div class="input-wrapper">
          <input type="password" id="apiKeyInput" placeholder="API Key">
          <button type="button" class="btn-eye" id="btnToggleVisibility" aria-label="Toggle API Key Visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <button type="button" class="btn-refresh" id="btnSaveKey" title="Save API Key & Reload">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>

      <!-- Missing API Key Notice Line -->
      <div id="apiKeyNotice" class="api-notice" style="display: none;">
        Get a free API key at <a href="https://finnhub.io/" id="finnhubLink" target="_blank" rel="noopener">finnhub.io</a>
      </div>

      <label class="status-label" for="statusText">Status</label>
      <textarea id="statusText" readonly placeholder="Waiting for status updates..."></textarea>

      <!-- Action Buttons Row: Rise - Locate - Fall -->
      <div class="action-buttons">
        <button type="button" class="btn-action btn-rise" id="btnRise">Rise</button>
        <button type="button" class="btn-action btn-locate" id="btnLocate">Locate</button>
        <button type="button" class="btn-action btn-fall" id="btnFall">Fall</button>
      </div>
    </div>
  </details>

  <!-- About Foldable Section -->
  <details id="aboutSection" class="foldable-section">
    <summary class="section-title">About</summary>
    <div class="section-content about-content">
      <p class="about-text">Real-time market price assistant for web-based trading platforms.</p>
      <div class="about-links">
        <a href="https://github.com" id="githubLink" target="_blank" rel="noopener">GitHub</a>
        <span class="link-separator">•</span>
        <a href="https://instagram.com" id="instagramLink" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
